name: Publish Monopin
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx tsc --noEmit --incremental false
      - run: node tests/room-urls.mjs
      - run: npm run test:firebase
      - run: npm run build:pages
        env:
          MONOPIN_FIREBASE_CONFIG: ${{ vars.MONOPIN_FIREBASE_CONFIG }}
          MONOPIN_GA_MEASUREMENT_ID: ${{ vars.MONOPIN_GA_MEASUREMENT_ID }}
          MONOPIN_BASE: ${{ vars.MONOPIN_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

